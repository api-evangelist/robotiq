aid: robotiq
name: Robotiq
description: >-
  Robotiq designs and manufactures collaborative robotics hardware and software
  — adaptive grippers, vacuum grippers, force-torque sensors, wrist cameras, and
  pre-engineered workcells for palletizing, machine tending, screwdriving, and
  assembly. Founded in 2008 and headquartered in Lévis, Quebec, Canada, the
  company helps manufacturers automate repetitive tasks by embedding task
  intelligence ("Intelligence Made Physical") directly into end-of-arm tooling
  for platforms such as Universal Robots, FANUC CRX, and Omron/Techman. Robotiq
  publishes open-source ROS drivers and a C++ gripper SDK through its GitHub
  organization, but it does not operate a public web/REST API — this profile
  captures its developer-facing identity, open-source SDKs, and domain security
  posture rather than a hosted API surface.
